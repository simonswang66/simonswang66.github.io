<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>弹珠掉落乐园</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Segoe UI Emoji', 'Apple Color Emoji', cursive, sans-serif;
    background: linear-gradient(160deg, #fef9e7, #fdebd0, #f9e5b3, #fce4d6);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* 漂浮背景装饰 */
  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-decor span {
    position: absolute;
    font-size: 30px;
    opacity: 0.35;
    animation: floatAround 6s ease-in-out infinite;
  }
  .bg-decor span:nth-child(1) { left: 6%; top: 12%; animation-delay: 0s; }
  .bg-decor span:nth-child(2) { left: 88%; top: 18%; animation-delay: 1.2s; }
  .bg-decor span:nth-child(3) { left: 12%; top: 78%; animation-delay: 2.4s; }
  .bg-decor span:nth-child(4) { left: 90%; top: 70%; animation-delay: 0.6s; }
  .bg-decor span:nth-child(5) { left: 70%; top: 8%; animation-delay: 1.8s; }
  .bg-decor span:nth-child(6) { left: 30%; top: 88%; animation-delay: 3s; }
  @keyframes floatAround {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-22px) rotate(10deg); }
  }

  /* ========== 整机外壳 ========== */
  .machine {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: min(520px, 100%);
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    background: linear-gradient(180deg, #fff6e3, #ffedcb 55%, #ffe3b3);
    border-left: 4px solid #d8956a;
    border-right: 4px solid #d8956a;
    box-shadow: 0 0 0 4px rgba(255, 244, 220, 0.6), 0 18px 44px rgba(160, 90, 30, 0.28);
  }
  @media (min-width: 560px) {
    body { display: flex; align-items: center; justify-content: center; }
    .machine {
      height: min(880px, calc(100vh - 24px));
      height: min(880px, calc(100dvh - 24px));
      border: 4px solid #d8956a;
      border-radius: 30px;
      overflow: hidden;
    }
  }

  /* 机身屏幕（招牌 + 游戏区 + 提示屏全部画在 canvas 里） */
  #screen {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: block;
    touch-action: none;
  }

  /* ========== 底座控制台 ========== */
  .console {
    flex-shrink: 0;
    border-top: 3px solid #d8956a;
    background: linear-gradient(180deg, #ffe9c2, #ffdfaa);
    box-shadow: inset 0 3px 8px rgba(180, 110, 40, 0.18);
    padding: 8px 12px 4px;
  }
  .console-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .home-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.88);
    border: 3px solid #f0c48a;
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 #d8a865;
    transition: all 0.15s;
    text-decoration: none;
    color: inherit;
  }
  .home-btn:hover { transform: scale(1.08); }
  .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d8a865; }

  .balance-block {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
    min-width: 0;
  }
  .balance-line {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .coin-icon { font-size: 22px; }
  #balance {
    font-size: 34px;
    font-weight: 700;
    color: #e65c1e;
    text-shadow: 2px 2px 0 #ffd966;
  }
  #balance.pop { animation: popNum 0.3s ease; }
  #balance.pop-win { animation: popNum 0.3s ease; color: #2e8b57; }
  @keyframes popNum {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .mini-stats {
    font-size: 11px;
    color: #b08a5c;
    white-space: nowrap;
  }

  .console-spacer { flex: 1; }

  /* 筹码按钮区（跑灯时切换为「停！」） */
  .bet-zone {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chip-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px dashed rgba(255, 255, 255, 0.85);
    outline: 3px solid #c94f12;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    font-family: inherit;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffa25e, #e65c1e 70%);
    box-shadow: 0 5px 0 #b34a12, 0 7px 12px rgba(150, 70, 20, 0.35);
    transition: all 0.12s ease;
    text-shadow: 1px 1px 0 rgba(120, 40, 0, 0.45);
  }
  .chip-btn.ten {
    outline-color: #cf7a2a;
    background: radial-gradient(circle at 35% 30%, #ffd08a, #f08c3a 70%);
    box-shadow: 0 5px 0 #c06a1e, 0 7px 12px rgba(150, 70, 20, 0.35);
  }
  .chip-btn:hover { transform: translateY(-2px); }
  .chip-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b34a12;
  }
  .chip-btn.ten:active { box-shadow: 0 2px 0 #c06a1e; }
  .chip-btn:disabled {
    opacity: 0.42;
    cursor: default;
    transform: none;
    pointer-events: none;
  }

  .stop-btn {
    display: none;
    width: 76px;
    height: 56px;
    border-radius: 999px;
    border: 3px solid rgba(255, 255, 255, 0.7);
    color: #fff;
    font-weight: 700;
    font-size: 22px;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b6b, #e63946);
    box-shadow: 0 5px 0 #b02434, 0 7px 12px rgba(150, 30, 40, 0.35);
    animation: stopPulse 0.8s ease infinite alternate;
    text-shadow: 1px 1px 0 rgba(120, 10, 20, 0.5);
  }
  .stop-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b02434; }
  .bet-zone.stopping .chip-btn { display: none; }
  .bet-zone.stopping .stop-btn { display: block; }
  @keyframes stopPulse {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }

  .sound-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid #f0c48a;
    background: rgba(255, 255, 255, 0.88);
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 3px 0 #d8a865;
    transition: all 0.15s;
  }
  .sound-btn:hover { transform: scale(1.08); }
  .sound-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d8a865; }

  .hint-row {
    text-align: center;
    font-size: 10px;
    color: #c9a06a;
    padding: 3px 0 2px;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
  }

  /* ========== 破产结算 overlay ========== */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(60, 30, 10, 0.45);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-card {
    background: linear-gradient(160deg, #fffdf5, #fff3d6);
    border: 4px solid #d8956a;
    border-radius: 28px;
    padding: 26px 34px;
    text-align: center;
    box-shadow: 0 12px 36px rgba(120, 60, 20, 0.4);
    max-width: 88vw;
  }
  .overlay-card h2 {
    font-size: 27px;
    color: #e65c1e;
    margin-bottom: 14px;
    text-shadow: 2px 2px 0 #ffd966;
  }
  .ov-stats {
    display: inline-block;
    text-align: left;
    font-size: 15px;
    color: #8a5a2b;
    line-height: 2;
  }
  .ov-stats b { color: #c25d1a; }
  .overlay-card .ov-best {
    font-size: 17px;
    color: #c25d1a;
    font-weight: 700;
    margin-top: 8px;
  }
  .overlay-card button {
    margin-top: 16px;
    border: none;
    border-radius: 999px;
    color: #fff;
    font-weight: 700;
    font-size: 21px;
    font-family: inherit;
    padding: 13px 38px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff8c3a, #e65c1e);
    box-shadow: 0 6px 0 #c94f12;
    transition: all 0.15s ease;
  }
  .overlay-card button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c94f12;
  }

  /* ========== 飞筹码动画 ========== */
  .fly-ball {
    position: fixed;
    z-index: 500;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    pointer-events: none;
    transition: all 0.6s cubic-bezier(0.3, 0.7, 0.5, 1);
  }

  /* ========== 响应式与降级 ========== */
  @media (max-width: 600px) {
    .console { padding: 7px 10px 3px; }
    .chip-btn { width: 50px; height: 50px; font-size: 15px; }
    .stop-btn { width: 68px; height: 50px; font-size: 20px; }
    #balance { font-size: 29px; }
    .home-btn, .sound-btn { width: 40px; height: 40px; font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-decor span { animation: none; }
    .fly-ball { transition-duration: 0.15s; }
    .stop-btn { animation: none; }
  }
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-decor">
  <span>🌟</span><span>🧸</span><span>🎈</span><span>🐣</span><span>🌈</span><span>💖</span>
</div>

<div class="machine">
  <!-- 机身：招牌赔率灯 + 游戏区 + LED 提示屏（全部 canvas 绘制） -->
  <canvas id="screen"></canvas>

  <!-- 底座控制台 -->
  <div class="console">
    <div class="console-row">
      <a class="home-btn" href="index.html" title="回乐园">🏠</a>
      <div class="balance-block">
        <div class="balance-line">
          <span class="coin-icon">🪙</span>
          <span id="balance">100</span>
        </div>
        <div class="mini-stats">投了 <span id="throws">0</span> 颗筹码 · 中奖 <span id="wins">0</span> 次</div>
      </div>
      <div class="console-spacer"></div>
      <div class="bet-zone" id="bet-zone">
        <button class="chip-btn" id="bet-btn5">+5</button>
        <button class="chip-btn ten" id="bet-btn10">+10</button>
        <button class="stop-btn" id="stop-btn">停！</button>
      </div>
      <button class="sound-btn" id="sound-btn" title="音效开关">🔊</button>
    </div>
    <div class="hint-row">右键 +1 筹码 · ↑ +5 筹码 · 回车 开始 · 按住空格 蓄力弹出</div>
  </div>
</div>

<!-- 破产结算 -->
<div id="overlay" class="hidden">
  <div class="overlay-card">
    <h2>🎪 游戏结束啦！</h2>
    <div class="ov-stats">
      一共投入 <b id="ov-throws">0</b> 颗筹码<br>
      本次最高攒到 <b id="ov-peak">0</b> 颗筹码<br>
      中奖 <b id="ov-wins">0</b> 次 · 最高赔率 <b id="ov-maxmult">x2</b>
    </div>
    <p class="ov-best">🏆 历史最佳纪录：<span id="ov-best">0</span> 颗筹码</p>
    <button id="restart-btn">🔄 再玩一次</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ======================== CFG · 规则参数（玩法手感集中区） ========================
  const CFG = {
    INITIAL_BALLS: 100,      // 初始筹码数
    MIN_BET: 5,              // 最少开局筹码（右键/上键累积投入，回车确认；一局 = 投入数）
    PENDING_MAX: 99,         // 键盘累积投入上限
    SLOT_COUNT: 16,          // 槽位数
    PEG_ROWS: 11,            // 钉子行数
    // 赔率 → 中奖槽数（赔率越高中奖槽越少；停灯真随机定格，各赔率约 25%）
    MULT_WIN_SLOTS: { 2: 14, 4: 6, 6: 4, 8: 2 },
    LAMP_VALUES: [2, 4, 6, 8],     // 招牌大灯泡（从左到右）
    LAMP_RUN_MS: 180,              // 跑灯轮转间隔
    // 停灯：真随机走 4~7 步，步间隔指数减速
    STOP_STEP_MIN: 4,
    STOP_STEP_RANGE: 4,
    STOP_TICK0: 150,
    STOP_TICK_GROW: 1.22,
    STOP_TICK_MAX: 700,
    // 物理
    GRAVITY: 2400,           // px/s²
    E_PIN: 0.5,              // 钉反弹系数
    E_WALL: 0.65,            // 壁反弹系数
    E_DIVIDER: 0.45,         // 槽隔板反弹系数
    FIXED_DT: 1 / 240,       // 物理子步长
    MAX_SUBSTEPS: 8,         // 每帧最大子步数
    SAFETY_TIMEOUT: 4000,    // 球卡死兜底（ms）
    LAUNCH_V0_MIN: 900,      // 弹射初速下限（沿管路径；出口速度随力度拉开差距的关键）
    LAUNCH_V0_RANGE: 2300,   // 弹射初速范围
    POWER_MIN: 0.2,          // 低于此力度 → 球不动重新拉（layout 时按几何动态校准）
    FREE_VX_CAP: 1500,       // 出弧后水平速度上限（防穿透/防乱飞）
    PEG_SPIN: 0.42,          // 钉碰撞切向随机偏转幅度（rad，约 ±12°）
    // 弹珠回程（唯一弹珠循环利用）
    RETURN_DURATION: 600,    // 弹珠飞回发射管动画时长（ms）
    RETURN_HOP: 90,          // 回程贝塞尔控制点上抬高度（px）
    // 结算装饰
    FLY_DECOR_MAX: 12,       // 中奖装饰飞球上限（颗，余额一次性入账）
    BET_FLY_MAX: 5,          // 投入时飞球动画上限
    MARBLE_COLOR: '#e64545', // 唯一弹珠主色（红色玻璃漩涡弹珠）
    DING_INTERVAL: 55,       // 钉子叮声音效限频（ms）
    INTERACTION_DEBOUNCE: 180, // 触摸+点击防抖（ms）
    MAX_PULL: 64,            // 弹簧杆最大拉伸距离（px）
  };

  // ======================== THEME · 视觉色板 ========================
  const THEME = {
    shellTop: '#fff6e3', shellBottom: '#ffe3b3',
    marqueeTop: '#ff9440', marqueeBottom: '#e6601e',
    marqueeBorder: '#b34a12', marqueeText: '#fff7e8',
    fieldBg: '#fffaf0', fieldBorder: '#d8a865',
    pegColors: ['#ff7d9c', '#ffb14d', '#ffd94d', '#7fd18b', '#6db3f2', '#b892e0'],
    tubeWall: '#b08950', wood: '#c8a46c', woodDark: '#9c7a4a',
    ledBg: '#4a2e14', ledBorder: '#2e1a08', ledText: '#ffd94d',
    lampOnCore: '#fff7c0', lampOnMid: '#ffd94d', lampOnEdge: '#e8940a',
    lampOffTop: '#cfc4b2', lampOffBottom: '#8f8674',
    winGlow: 'rgba(255, 190, 50, 0.85)',
    knobTop: '#ffd0d0', knobMid: '#ef5656', knobEdge: '#b32424',
  };

  // ======================== DOM ========================
  const $ = (id) => document.getElementById(id);
  const canvas = $('screen');
  const ctx = canvas.getContext('2d');
  const balanceEl = $('balance');
  const throwsEl = $('throws');
  const winsEl = $('wins');
  const soundBtn = $('sound-btn');
  const betZone = $('bet-zone');
  const betBtn5 = $('bet-btn5');
  const betBtn10 = $('bet-btn10');
  const stopBtn = $('stop-btn');
  const overlay = $('overlay');

  // ======================== Audio · 音效引擎 ========================
  let audioCtx = null;
  let soundEnabled = true;
  let lastDingTime = 0;

  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playTone(frequency, startTime, duration, type = 'sine', volume = 0.16) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, startTime);
    gainNode.gain.setValueAtTime(0.001, startTime);
    gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start(startTime);
    oscillator.stop(startTime + duration + 0.03);
  }

  function nowTime() { return audioCtx ? audioCtx.currentTime : 0; }

  // 投币入机哗啦声
  function playThrowSound() {
    if (!soundEnabled) return;
    initAudio();
    const now = nowTime();
    [392, 349, 330, 294].forEach((f, i) => playTone(f, now + i * 0.06, 0.07, 'triangle', 0.12));
  }

  // 跑灯 tick
  function playTickSound() {
    if (!soundEnabled) return;
    initAudio();
    playTone(1568, nowTime(), 0.04, 'square', 0.05);
  }

  // 停灯定格
  function playStopSound() {
    if (!soundEnabled) return;
    initAudio();
    const now = nowTime();
    playTone(1046, now, 0.15, 'triangle', 0.15);
    playTone(784, now + 0.05, 0.22, 'triangle', 0.14);
  }

  // 钉子碰撞叮声（限频 + 随机音高防机枪感）
  function playPinDing() {
    if (!soundEnabled) return;
    const now = Date.now();
    if (now - lastDingTime < CFG.DING_INTERVAL) return;
    lastDingTime = now;
    initAudio();
    playTone(1300 + Math.random() * 300, nowTime(), 0.035, 'sine', 0.05);
  }

  // 弹簧蓄力吱声（音高随力度）
  function playChargeSound(power) {
    if (!soundEnabled) return;
    initAudio();
    playTone(280 + power * 520, nowTime(), 0.08, 'sawtooth', 0.05);
  }

  // 弹射"啵"声
  function playLaunchSound() {
    if (!soundEnabled) return;
    initAudio();
    const now = nowTime();
    playTone(900, now, 0.09, 'triangle', 0.14);
    playTone(480, now + 0.06, 0.12, 'triangle', 0.12);
  }

  // 超级玛丽 game over 音效（NES triangle 波快速下行 + 低音收尾）
  function playMarioGameOver() {
    if (!soundEnabled) return;
    initAudio();
    const now = nowTime();
    const run = [523.25, 493.88, 466.16, 440, 415.30, 392, 369.99, 349.23];
    run.forEach((f, i) => playTone(f, now + i * 0.085, 0.09, 'triangle', 0.13));
    playTone(329.63, now + run.length * 0.085, 0.3, 'triangle', 0.13);
    playTone(261.63, now + run.length * 0.085 + 0.32, 0.45, 'triangle', 0.13);
  }

  // 中奖上行音阶（x8 大奖加高音装饰）
  function playWinSound(mult) {
    if (!soundEnabled) return;
    initAudio();
    const now = nowTime();
    [523.25, 659.25, 783.99].forEach((f, i) => playTone(f, now + i * 0.1, 0.2, 'sine', 0.16));
    if (mult >= 8) {
      playTone(1046.5, now + 0.32, 0.3, 'sine', 0.17);
      playTone(1318.5, now + 0.45, 0.35, 'sine', 0.16);
    }
  }

  // 轻拉失败短音
  function playWeakSound() {
    if (!soundEnabled) return;
    initAudio();
    const now = nowTime();
    playTone(330, now, 0.1, 'triangle', 0.1);
    playTone(260, now + 0.1, 0.14, 'triangle', 0.09);
  }

  // ======================== State · 游戏状态 ========================
  const CHIP_COLORS = ['#e64545', '#4a90d9', '#3cb371', '#f5a623', '#9b59b6', '#ff6f91', '#20b2aa'];
  const STORAGE_KEY = 'babyParadise.plinko.bestPeak';

  let balance = CFG.INITIAL_BALLS;
  let throws = 0;          // 累计投筹码数
  let wins = 0;            // 累计中奖次数
  let peak = balance;      // 本次最高筹码数
  let maxMult = 2;         // 本次最高赔率
  let bestPeak = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);

  let state = 'idle';      // idle | runningLights | ballReady | falling | returning | gameover
  let round = null;        // { bet, mult, winSlots, winLanes:Set }
  let pending = 0;         // 键盘累积待投入筹码数（右键+1 / ↑+5 / 回车确认）

  // 招牌大灯泡
  let lampStates = CFG.LAMP_VALUES.map(() => 'off'); // off | on | win | dim
  let lampTimer = null;
  let lampIndex = 0;

  // 弹珠（唯一一颗，循环利用）
  let ball = null;         // { phase:'tube'|'free'|'settling'|'return', ... }
  let slotLights = new Array(CFG.SLOT_COUNT).fill(false);
  let slotFlash = null;    // { lane, t } 中奖槽发光脉冲

  // LED 提示屏
  let ledText = '';
  let ledBlink = false;

  // 弹簧杆
  let pulling = false;
  let pullStartY = 0;
  let pullDist = 0;        // 当前拉伸距离（渲染用）
  let springSnap = false;  // 松手后弹簧回弹动画标记
  let chargeTimer = null;

  // ======================== Layout · 几何 ========================
  let W = 0, H = 0, dpr = 1;
  // 机身区域
  let marqueeRect, ledRect;                    // { x, y, w, h }
  let lampSpots = [];                          // [{ x, y, r, mult }]
  let decoBulbs = [];                          // 招牌装饰小灯泡 [{ x, y }]
  // 游戏区
  let padX, fieldX0, fieldX1, fieldW, slotW, ballR, pinR;
  let playTop, playBottom;
  let arcR, arcTopY, tubeCx, tubeW, tubeBottomY, arcExitX, arcExitY;
  let firstPegY, lastPegY, rowGap, slotTop, slotBottom, slotLightY;
  let pegs = [];                               // [{ x, y, color }]
  let pathTubeLen, pathArcLen, pathTotal, pathTubeT;
  // 弹簧杆
  let plungerRect;                             // hit 区 { x0, y0, x1, y1 }
  let gaugeRect;                               // 蓄力条 { x, y, w, h }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function layout() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    if (!W || !H) return;

    // 区域划分：招牌 / 游戏区 / LED 提示屏
    const marqueeH = clamp(H * 0.16, 100, 126);
    const ledH = 36;
    marqueeRect = { x: 8, y: 8, w: W - 16, h: marqueeH - 14 };
    playTop = marqueeH + 4;
    playBottom = H - ledH - 4;
    ledRect = { x: 8, y: H - ledH, w: 0, h: ledH - 8 }; // 宽度待游戏区算完再定

    padX = Math.max(8, W * 0.025);
    tubeW = clamp(W * 0.09, 26, 38);
    const gapW = 14; // 游戏区与发射管列之间的间隙（放蓄力条）
    fieldX0 = padX;
    fieldX1 = W - padX - tubeW - gapW;
    fieldW = fieldX1 - fieldX0;
    slotW = fieldW / CFG.SLOT_COUNT;
    ballR = slotW * 0.28;
    pinR = ballR * 0.55;

    // 发射管（右侧）与顶部弧道
    tubeCx = W - padX - tubeW / 2;
    arcR = clamp(W * 0.12, 30, 52);
    arcTopY = playTop + arcR + 8;
    tubeBottomY = H - 112;            // 管底下方留 112px 给弹簧杆
    arcExitX = tubeCx - arcR;         // 出弧点（90° 弧道尽头，弹珠水平向左飞出）
    arcExitY = arcTopY - arcR;

    // 钉子阵
    firstPegY = arcTopY + 30;
    lastPegY = playTop + (playBottom - playTop) * 0.66;
    rowGap = (lastPegY - firstPegY) / (CFG.PEG_ROWS - 1);
    slotTop = lastPegY + rowGap * 0.9;
    slotBottom = Math.min(slotTop + Math.max(40, rowGap * 1.15), playBottom - 20);
    slotLightY = slotBottom + 14;

    pegs = [];
    for (let r = 0; r < CFG.PEG_ROWS; r++) {
      const y = firstPegY + r * rowGap;
      const color = THEME.pegColors[r % THEME.pegColors.length];
      if (r % 2 === 0) {
        for (let j = 1; j < CFG.SLOT_COUNT; j++) {
          pegs.push({ x: fieldX0 + j * slotW, y, color });
        }
      } else {
        for (let j = 0; j < CFG.SLOT_COUNT; j++) {
          pegs.push({ x: fieldX0 + (j + 0.5) * slotW, y, color });
        }
      }
    }

    // 发射管引导路径（管段 + 顶部 90° 弧段，出口水平向左）
    pathTubeLen = (tubeBottomY - ballR - 4) - arcTopY;
    pathArcLen = (Math.PI / 2) * arcR;
    pathTotal = pathTubeLen + pathArcLen;
    pathTubeT = pathTubeLen / pathTotal;

    // 动态校准最小有效力度：恰好能飞过弧顶所需初速对应的力度 + 3% 余量
    const reqV = Math.sqrt(2 * (CFG.GRAVITY * pathTubeLen + CFG.GRAVITY * 0.5 * pathArcLen));
    CFG.POWER_MIN = Math.max(0.12, (reqV - CFG.LAUNCH_V0_MIN) / CFG.LAUNCH_V0_RANGE + 0.03);

    // 招牌大灯泡位置（一行四盏，居中）
    const lampR = clamp(W * 0.048, 17, 24);
    const lampY = marqueeRect.y + marqueeRect.h - lampR - 10;
    const spacing = Math.min(92, (marqueeRect.w - 40) / 4);
    const startX = marqueeRect.x + marqueeRect.w / 2 - spacing * 1.5;
    lampSpots = CFG.LAMP_VALUES.map((mult, i) => ({
      x: startX + i * spacing,
      y: lampY,
      r: lampR,
      mult,
    }));

    // 招牌装饰小灯泡（顶边一排）
    decoBulbs = [];
    const nBulbs = Math.floor(marqueeRect.w / 44);
    for (let i = 0; i < nBulbs; i++) {
      decoBulbs.push({
        x: marqueeRect.x + (marqueeRect.w / Math.max(1, nBulbs)) * (i + 0.5),
        y: marqueeRect.y + 9,
      });
    }

    // LED 提示屏横贯游戏区（右端止于弹簧杆旋钮之外）
    ledRect.w = fieldX1 - 10;

    // 弹簧杆 hit 区与蓄力条
    plungerRect = {
      x0: tubeCx - 36, x1: tubeCx + 36,
      y0: tubeBottomY - 10, y1: H,
    };
    const gaugeH = 92;
    gaugeRect = {
      x: fieldX1 + 4,
      y: tubeBottomY - 4 - gaugeH,
      w: 8,
      h: gaugeH,
    };
  }

  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    layout();
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 沿引导路径求弹珠位置（t ∈ [0,1]，0=管底，1=滑轨末端；管在右侧，90° 弧向左弯，出口水平朝左）
  function pathPoint(t) {
    if (t <= pathTubeT) {
      const s = t / pathTubeT; // 0=管底 1=管顶
      const y0 = tubeBottomY - ballR - 4;
      return { x: tubeCx, y: y0 - s * pathTubeLen };
    }
    const s = (t - pathTubeT) / (1 - pathTubeT); // 弧段 0=管顶 1=出弧点
    const ang = -s * Math.PI / 2; // 圆心 (tubeCx-arcR, arcTopY)，角度 0 → -90°
    return {
      x: (tubeCx - arcR) + arcR * Math.cos(ang),
      y: arcTopY + arcR * Math.sin(ang),
    };
  }

  // ======================== Render · canvas 绘制 ========================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shadeColor(hex, percent) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp((n >> 16) + percent, 0, 255);
    const g = clamp(((n >> 8) & 0xff) + percent, 0, 255);
    const b = clamp((n & 0xff) + percent, 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  function drawShell() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, THEME.shellTop);
    g.addColorStop(1, THEME.shellBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawMarquee(now) {
    const m = marqueeRect;
    // 招牌面板
    const g = ctx.createLinearGradient(0, m.y, 0, m.y + m.h);
    g.addColorStop(0, THEME.marqueeTop);
    g.addColorStop(1, THEME.marqueeBottom);
    roundRect(m.x, m.y, m.w, m.h, 18);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = THEME.marqueeBorder;
    ctx.stroke();
    // 面板高光
    roundRect(m.x + 5, m.y + 4, m.w - 10, m.h * 0.4, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fill();

    // 装饰小灯泡（交替微闪）
    decoBulbs.forEach((b, i) => {
      const tw = 0.55 + 0.45 * Math.sin(now / 320 + i * 1.7);
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 226, 130, ${0.45 + tw * 0.55})`;
      ctx.fill();
    });

    // 标题
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const titleSize = clamp(W * 0.055, 20, 27);
    ctx.font = `700 ${titleSize}px "Comic Sans MS","Chalkboard SE","PingFang SC",cursive`;
    ctx.fillStyle = 'rgba(122, 48, 0, 0.55)';
    ctx.fillText('🎪 弹珠乐园', m.x + m.w / 2 + 1.5, m.y + 30 + 1.5);
    ctx.fillStyle = THEME.marqueeText;
    ctx.fillText('🎪 弹珠乐园', m.x + m.w / 2, m.y + 30);

    // 四盏赔率大灯泡
    lampSpots.forEach((spot, i) => {
      drawLamp(spot, lampStates[i], now);
    });
  }

  function drawLamp(spot, lampState, now) {
    const { x, y, r } = spot;
    if (lampState === 'on' || lampState === 'win') {
      // 光晕
      const pulse = lampState === 'win'
        ? 0.85 + 0.15 * Math.sin(now / 110)
        : 1;
      const glowR = r * (lampState === 'win' ? 2.1 : 1.7) * pulse;
      const halo = ctx.createRadialGradient(x, y, r * 0.4, x, y, glowR);
      halo.addColorStop(0, 'rgba(255, 214, 90, 0.85)');
      halo.addColorStop(1, 'rgba(255, 214, 90, 0)');
      ctx.beginPath();
      ctx.arc(x, y, glowR, 0, Math.PI * 2);
      ctx.fillStyle = halo;
      ctx.fill();
      // 灯体
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.15, x, y, r);
      g.addColorStop(0, THEME.lampOnCore);
      g.addColorStop(0.5, THEME.lampOnMid);
      g.addColorStop(1, THEME.lampOnEdge);
      ctx.beginPath();
      ctx.arc(x, y, r * (lampState === 'win' ? 1.12 : 1), 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#c98a1e';
      ctx.stroke();
      ctx.fillStyle = '#7a3b00';
    } else {
      const alpha = lampState === 'dim' ? 0.35 : 1;
      ctx.globalAlpha = alpha;
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.15, x, y, r);
      g.addColorStop(0, THEME.lampOffTop);
      g.addColorStop(1, THEME.lampOffBottom);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(110, 96, 74, 0.8)';
      ctx.stroke();
      ctx.fillStyle = '#5f5646';
    }
    // 数字
    ctx.font = `700 ${Math.round(r * 0.78)}px "Comic Sans MS","Chalkboard SE",cursive`;
    ctx.fillText('x' + spot.mult, x, y + 1);
    ctx.globalAlpha = 1;
  }

  function drawFieldPanel() {
    // 游戏区内衬面板（含发射管列）
    roundRect(padX - 4, playTop - 2, W - padX * 2 + 8, playBottom - playTop + 4, 16);
    ctx.fillStyle = THEME.fieldBg;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = THEME.fieldBorder;
    ctx.stroke();
  }

  function drawTubeAndArc() {
    ctx.strokeStyle = THEME.tubeWall;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    // 发射管两壁（右侧管）
    ctx.beginPath();
    ctx.moveTo(tubeCx - tubeW / 2, tubeBottomY);
    ctx.lineTo(tubeCx - tubeW / 2, arcTopY);
    ctx.moveTo(tubeCx + tubeW / 2, tubeBottomY);
    ctx.lineTo(tubeCx + tubeW / 2, arcTopY);
    ctx.stroke();
    // 管壁玻璃高光
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tubeCx - tubeW / 2 + 4, tubeBottomY - 6);
    ctx.lineTo(tubeCx - tubeW / 2 + 4, arcTopY + 6);
    ctx.stroke();
    // 顶部 90° 弧（外壁 + 内壁，向左弯，出口水平朝左，弧口敞开）
    ctx.strokeStyle = THEME.tubeWall;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(tubeCx - arcR, arcTopY, arcR + tubeW / 2, -Math.PI / 2, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(tubeCx - arcR, arcTopY, arcR - tubeW / 2, -Math.PI / 2, 0);
    ctx.stroke();
    // 管底座（弹簧杆基座）
    ctx.fillStyle = THEME.woodDark;
    roundRect(tubeCx - tubeW / 2 - 5, tubeBottomY - 2, tubeW + 10, 9, 3);
    ctx.fill();
  }

  function drawPeg(peg) {
    // 糖果钉：彩色圆头 + 白色高光
    ctx.beginPath();
    ctx.arc(peg.x, peg.y, pinR, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(
      peg.x - pinR * 0.3, peg.y - pinR * 0.3, pinR * 0.15,
      peg.x, peg.y, pinR
    );
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.45, peg.color);
    g.addColorStop(1, shadeColor(peg.color, -40));
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawSlots() {
    // 槽隔板（圆头立柱）
    for (let i = 1; i < CFG.SLOT_COUNT; i++) {
      const x = fieldX0 + i * slotW;
      ctx.strokeStyle = THEME.wood;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, slotTop);
      ctx.lineTo(x, slotBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, slotTop, slotW * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = THEME.wood;
      ctx.fill();
    }
    // 槽底横板
    ctx.strokeStyle = THEME.tubeWall;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(fieldX0 - 4, slotBottom);
    ctx.lineTo(fieldX1 + 4, slotBottom);
    ctx.stroke();

    // 中奖槽高亮描边
    if (round && round.winLanes) {
      round.winLanes.forEach((lane) => {
        const x0 = fieldX0 + lane * slotW;
        ctx.strokeStyle = THEME.winGlow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x0 + 2, slotTop + 2);
        ctx.lineTo(x0 + 2, slotBottom - 2);
        ctx.lineTo(x0 + slotW - 2, slotBottom - 2);
        ctx.lineTo(x0 + slotW - 2, slotTop + 2);
        ctx.stroke();
      });
    }
    // 中奖槽发光脉冲
    if (slotFlash) {
      const x0 = fieldX0 + slotFlash.lane * slotW;
      const a = Math.max(0, 1 - slotFlash.t / 0.6);
      ctx.fillStyle = `rgba(255, 220, 90, ${a * 0.45})`;
      ctx.fillRect(x0 + 2, slotTop + 2, slotW - 4, slotBottom - slotTop - 4);
    }
  }

  function drawSlotLights(now) {
    for (let i = 0; i < CFG.SLOT_COUNT; i++) {
      const x = fieldX0 + (i + 0.5) * slotW;
      const y = slotLightY;
      const r = Math.max(3.2, ballR * 0.72);
      if (slotLights[i]) {
        const pulse = 0.75 + 0.25 * Math.sin(now / 140);
        const g = ctx.createRadialGradient(x, y, 1, x, y, 8);
        g.addColorStop(0, `rgba(255, 235, 150, ${pulse})`);
        g.addColorStop(0.5, `rgba(255, 190, 50, ${pulse})`);
        g.addColorStop(1, 'rgba(255, 190, 50, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffc02e';
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#d8c4a0';
        ctx.fill();
      }
    }
  }

  function drawPlunger() {
    // 弹簧杆：基座 → 弹簧（拉伸螺旋）→ 连杆 → 红圆钮
    const springTopY = tubeBottomY + 10;
    const springH = 18 + pullDist * 0.5;      // 拉伸视觉
    const springBottomY = springTopY + springH;
    const knobR = 23;
    const rodLen = 8;
    const knobY = springBottomY + rodLen + knobR;

    // 弹簧（之字螺旋）
    const coils = 6;
    const halfW = tubeW * 0.3;
    ctx.strokeStyle = '#9c8a6a';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(tubeCx, springTopY);
    for (let i = 1; i <= coils; i++) {
      const y = springTopY + (springH / coils) * i;
      const x = tubeCx + (i % 2 === 1 ? halfW : -halfW);
      ctx.lineTo(x, i === coils ? springBottomY : y);
    }
    ctx.stroke();

    // 连杆
    ctx.strokeStyle = '#8f7c5c';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tubeCx, springBottomY);
    ctx.lineTo(tubeCx, knobY - knobR + 4);
    ctx.stroke();

    // 红圆钮
    const g = ctx.createRadialGradient(
      tubeCx - knobR * 0.35, knobY - knobR * 0.35, knobR * 0.15,
      tubeCx, knobY, knobR
    );
    g.addColorStop(0, THEME.knobTop);
    g.addColorStop(0.55, THEME.knobMid);
    g.addColorStop(1, THEME.knobEdge);
    ctx.beginPath();
    ctx.arc(tubeCx, knobY, knobR, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#8f1c1c';
    ctx.stroke();

    // 待机时呼吸提示圈
    if (state === 'ballReady' && !pulling) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
      ctx.beginPath();
      ctx.arc(tubeCx, knobY, knobR + 5 + pulse * 3, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(239, 86, 86, ${0.5 - pulse * 0.35})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function drawGauge() {
    const power = pullDist / CFG.MAX_PULL;
    if (power <= 0.01) return;
    const { x, y, w, h } = gaugeRect;
    // 底槽
    roundRect(x, y, w, h, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fill();
    ctx.strokeStyle = '#d8b98c';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 填充（绿→黄→红）
    const fh = h * clamp(power, 0, 1);
    const g = ctx.createLinearGradient(0, y + h, 0, y);
    g.addColorStop(0, '#4caf50');
    g.addColorStop(0.55, '#ffc93c');
    g.addColorStop(1, '#ff7043');
    roundRect(x + 1.5, y + h - fh, w - 3, Math.max(2, fh - 1.5), 3);
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall(b) {
    if (!b) return;
    let r = ballR;
    if (b.squash) {
      r *= 1 + b.squash * 0.18;
    }
    ctx.save();
    const x = b.x, y = b.y;
    // 唯一弹珠：玻璃漩涡质感；输局回程（sad）时变灰粉色
    const marbleBase = b.sad ? '#c99a9a' : b.color;
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, marbleBase);
    g.addColorStop(1, shadeColor(marbleBase, -45));
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    if (b.marble) {
      // 白色漩涡纹
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = Math.max(1.2, r * 0.22);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(x - r * 0.15, y - r * 0.2, r * 0.62, Math.PI * 0.75, Math.PI * 1.95);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + r * 0.28, y + r * 0.18, r * 0.34, Math.PI * 0.1, Math.PI * 1.15);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLed(now) {
    const { x, y, w, h } = ledRect;
    roundRect(x, y, w, h, 10);
    ctx.fillStyle = THEME.ledBg;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = THEME.ledBorder;
    ctx.stroke();

    if (!ledText) return;
    let alpha = 1;
    if (ledBlink) {
      alpha = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(now / 130));
    }
    let size = clamp(W * 0.032, 12, 15);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${size}px "Comic Sans MS","Chalkboard SE","PingFang SC",cursive`;
    // 超宽自动缩小
    while (size > 9 && ctx.measureText(ledText).width > w - 20) {
      size -= 1;
      ctx.font = `700 ${size}px "Comic Sans MS","Chalkboard SE","PingFang SC",cursive`;
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = THEME.ledText;
    ctx.shadowColor = 'rgba(255, 217, 77, 0.7)';
    ctx.shadowBlur = 6;
    ctx.fillText(ledText, x + w / 2, y + h / 2 + 1);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawScene(now) {
    ctx.clearRect(0, 0, W, H);
    drawShell();
    drawMarquee(now);
    drawFieldPanel();
    drawTubeAndArc();
    pegs.forEach(drawPeg);
    drawSlots();
    drawSlotLights(now);
    drawGauge();
    drawPlunger();
    drawBall(ball);
    drawLed(now);
  }

  // ======================== Physics · 物理 ========================
  let lastFrameTime = 0;
  let accumulator = 0;

  function frame(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 1 / 30);
    lastFrameTime = now;
    accumulator += dt;
    let steps = 0;
    while (accumulator >= CFG.FIXED_DT && steps < CFG.MAX_SUBSTEPS) {
      stepPhysics(CFG.FIXED_DT);
      accumulator -= CFG.FIXED_DT;
      steps++;
    }
    if (slotFlash) {
      slotFlash.t += dt;
      if (slotFlash.t >= 0.6) slotFlash = null;
    }
    // 松手后弹簧回弹
    if (springSnap && pullDist > 0) {
      pullDist = Math.max(0, pullDist - dt * 700);
      if (pullDist === 0) springSnap = false;
    }
    drawScene(now);
    requestAnimationFrame(frame);
  }

  function stepPhysics(dt) {
    if (!ball) return;

    if (ball.phase === 'tube') {
      stepTubeArc(dt);
      return;
    }
    if (ball.phase === 'settling') {
      stepSettling(dt);
      return;
    }
    if (ball.phase === 'return') {
      stepReturn(dt);
      return;
    }
    if (ball.phase === 'free') {
      stepFree(dt);
    }
  }

  function stepTubeArc(dt) {
    if (!ball.launched) {
      // 未发射：球静止在管底
      ball.t = 0;
      ball.v = 0;
      return;
    }
    // 沿引导路径：速度受重力衰减（管段全重力、弧段半重力模拟摩擦）
    const gEff = ball.t < pathTubeT ? CFG.GRAVITY : CFG.GRAVITY * 0.5;
    ball.v -= gEff * dt;
    ball.t += (ball.v * dt) / pathTotal;

    if (ball.t >= 1) {
      // 到达出弧点 → 释放为自由物理：水平向左飞出，力度越大飞得越远（落点越靠左）
      ball.phase = 'free';
      ball.x = arcExitX;
      ball.y = arcExitY;
      const exitSpeed = Math.min(Math.max(ball.v, 260), CFG.FREE_VX_CAP);
      ball.vx = -exitSpeed + (Math.random() - 0.5) * 60;
      ball.vy = (Math.random() - 0.5) * 60;
      ball.freeTime = 0;
      playLaunchSound();
      return;
    }
    if (ball.t <= 0 && ball.v < 0) {
      // 力度不足回落管底 → 重新待弹
      ball.t = 0;
      ball.v = 0;
      ball.launched = false;
      setState('ballReady');
      showLed('再拉一点，弹出弹珠！', true);
      playWeakSound();
      return;
    }
    const p = pathPoint(ball.t);
    ball.x = p.x;
    ball.y = p.y;
  }

  function stepFree(dt) {
    ball.vy += CFG.GRAVITY * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.freeTime += dt * 1000;

    // 左右壁
    if (ball.x < fieldX0 + ballR) {
      ball.x = fieldX0 + ballR;
      ball.vx = Math.abs(ball.vx) * CFG.E_WALL;
    } else if (ball.x > fieldX1 - ballR) {
      ball.x = fieldX1 - ballR;
      ball.vx = -Math.abs(ball.vx) * CFG.E_WALL;
    }

    // 球-钉碰撞
    for (const peg of pegs) {
      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;
      const rr = ballR + pinR;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 === 0) continue;
      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;
      ball.x = peg.x + nx * rr;
      ball.y = peg.y + ny * rr;
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) {
        ball.vx -= (1 + CFG.E_PIN) * vn * nx;
        ball.vy -= (1 + CFG.E_PIN) * vn * ny;
        // 切向随机偏转 ±12°
        const ang = (Math.random() - 0.5) * CFG.PEG_SPIN;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        const vx2 = ball.vx * cos - ball.vy * sin;
        const vy2 = ball.vx * sin + ball.vy * cos;
        ball.vx = vx2;
        ball.vy = vy2;
        playPinDing();
      }
    }

    // 槽区：隔板帽碰撞 + 水平阻尼
    if (ball.y > slotTop - ballR) {
      for (let i = 1; i < CFG.SLOT_COUNT; i++) {
        const px = fieldX0 + i * slotW;
        const dx = ball.x - px;
        const dy = ball.y - slotTop;
        const rr = ballR + slotW * 0.12;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        ball.x = px + nx * rr;
        ball.y = slotTop + ny * rr;
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) {
          ball.vx -= (1 + CFG.E_DIVIDER) * vn * nx;
          ball.vy -= (1 + CFG.E_DIVIDER) * vn * ny;
          // 悬停帽顶时按 vx 方向推入一侧
          if (Math.abs(ball.vx) < 8 && Math.abs(ball.vy) < 8) {
            ball.vx = (ball.x >= px ? 1 : -1) * 60;
          }
        }
      }
      // 碰撞后轻阻尼（每子步 0.99，约 1 秒衰减 90% 横向速度）
      ball.vx *= 0.99;
    }

    // 落槽判定
    if (ball.y >= slotBottom - ballR) {
      ball.lane = laneOf(ball.x);
      ball.phase = 'settling';
      ball.settleT = 0;
      ball.squash = 1;
      ball.vy = -Math.abs(ball.vy) * 0.25;
      return;
    }

    // 卡死兜底
    if (ball.freeTime > CFG.SAFETY_TIMEOUT) {
      ball.lane = laneOf(ball.x);
      ball.phase = 'settling';
      ball.settleT = 0;
      ball.squash = 0;
      return;
    }
  }

  function laneOf(x) {
    return clamp(Math.floor((x - fieldX0) / slotW), 0, CFG.SLOT_COUNT - 1);
  }

  function stepSettling(dt) {
    const targetX = fieldX0 + (ball.lane + 0.5) * slotW;
    ball.x += (targetX - ball.x) * Math.min(1, dt * 10);
    ball.vy += CFG.GRAVITY * 0.8 * dt;
    ball.y += ball.vy * dt;
    if (ball.y >= slotBottom - ballR) {
      ball.y = slotBottom - ballR;
      ball.vy = 0;
      ball.squash = Math.max(0, ball.squash - dt * 4);
      ball.settleT += dt;
      if (ball.settleT >= 0.22) {
        resolveBall(ball.lane);
      }
    }
  }

  // 弹珠回程：结算后沿贝塞尔弧线飞回发射管底（唯一弹珠循环利用）
  function stepReturn(dt) {
    ball.returnT += dt / (CFG.RETURN_DURATION / 1000);
    const bx = ball.returnFrom.x, by = ball.returnFrom.y;
    const ex = tubeCx, ey = tubeBottomY - ballR - 4;
    if (ball.returnT >= 1) {
      ball.x = ex;
      ball.y = ey;
      ball.phase = 'tube';
      ball.launched = false;
      ball.t = 0;
      ball.v = 0;
      ball.sad = false;
      finishReturn();
      return;
    }
    const t = ball.returnT, u = 1 - t;
    const mx = (bx + ex) / 2;
    const my = Math.min(by, ey) - CFG.RETURN_HOP; // 上拱控制点
    ball.x = u * u * bx + 2 * u * t * mx + t * t * ex;
    ball.y = u * u * by + 2 * u * t * my + t * t * ey;
    if (ball.sad) ball.squash = 0.6; // 输局回程：委屈鼓包
  }

  // ======================== Game · 规则与回合流程 ========================
  // 投入 n 筹码开局（n ≥ MIN_BET，一回合 = 一次投入 = 弹一次弹珠）
  function startGame(n, fromRect) {
    if (state !== 'idle') return;
    if (balance < n) return;
    balance -= n;
    throws += n;
    pending = 0;
    playThrowSound();
    updateBalanceUI('pop');
    flyChipsToMachine(n, fromRect);
    startRound(n);
  }

  function startRound(bet) {
    round = { bet, mult: 0, winSlots: 0, winLanes: new Set() };
    slotLights = new Array(CFG.SLOT_COUNT).fill(false);
    slotFlash = null;
    state = 'runningLights';
    updateUI();
    showLed(`投入 ${bet} 筹码 · 点「停！」定格赔率`);
    startLights();
  }

  // 唯一弹珠就位发射管底：外观恒定、循环利用（对象每次重建，视觉上始终是同一颗）
  function placeMarble() {
    ball = {
      phase: 'tube',
      launched: false,
      t: 0,
      v: 0,
      x: tubeCx,
      y: tubeBottomY - ballR - 4,
      vx: 0,
      vy: 0,
      marble: true,
      color: CFG.MARBLE_COLOR,
      lane: -1,
      freeTime: 0,
      settleT: 0,
      squash: 0,
      sad: false,
    };
  }

  function spawnBall() {
    placeMarble();
    state = 'ballReady';
    updateUI();
    showLed('拉弹簧杆，弹出弹珠！');
  }

  function launchBall(power) {
    if (state !== 'ballReady' || !ball) return;
    if (power < CFG.POWER_MIN) {
      // 力度不足：球不动，重新拉（不消耗）
      playWeakSound();
      showLed('再拉一点，弹出弹珠！', true);
      return;
    }
    state = 'falling';
    ball.launched = true;
    ball.v = CFG.LAUNCH_V0_MIN + power * CFG.LAUNCH_V0_RANGE;
    updateUI();
    showLed('弹珠弹跳中…');
  }

  // ---- 招牌跑灯 ----
  function startLights() {
    clearLampTimers();
    lampStates = CFG.LAMP_VALUES.map(() => 'off');
    lampIndex = 0;
    lampStates[0] = 'on';
    playTickSound();
    lampTimer = setInterval(() => {
      lampStates[lampIndex] = 'off';
      lampIndex = (lampIndex + 1) % lampSpots.length;
      lampStates[lampIndex] = 'on';
      playTickSound();
    }, CFG.LAMP_RUN_MS);
  }

  function stopLights() {
    if (state !== 'runningLights') return;
    state = 'stopping';
    updateUI();
    // 真随机停灯：走 4~7 步（4 个值 mod 4 恰好每盏灯 1/4），停在哪盏按哪盏结算
    const stepsTo = CFG.STOP_STEP_MIN + Math.floor(Math.random() * CFG.STOP_STEP_RANGE);
    let interval = CFG.STOP_TICK0;
    let step = 0;
    clearLampTimers();
    const slowTick = () => {
      step++;
      lampStates[lampIndex] = 'off';
      lampIndex = (lampIndex + 1) % lampSpots.length;
      lampStates[lampIndex] = 'on';
      playTickSound();
      if (step < stepsTo) {
        interval = Math.min(interval * CFG.STOP_TICK_GROW, CFG.STOP_TICK_MAX);
        lampTimer = setTimeout(slowTick, interval);
      } else {
        // 定格：停在哪盏，赔率就是哪盏
        const winnerIndex = lampIndex;
        round.mult = lampSpots[winnerIndex].mult;
        round.winSlots = CFG.MULT_WIN_SLOTS[round.mult];
        playStopSound();
        lampStates = lampStates.map((s, i) => (i === winnerIndex ? 'win' : 'dim'));
        showLed(`定格 x${round.mult} · ${round.winSlots} 个中奖槽！`);
        setTimeout(lightWinSlots, 500);
      }
    };
    lampTimer = setTimeout(slowTick, interval);
  }

  function clearLampTimers() {
    if (lampTimer) {
      clearTimeout(lampTimer);
      clearInterval(lampTimer);
      lampTimer = null;
    }
  }

  function lightWinSlots() {
    // 按停灯赔率随机点亮中奖槽指示灯
    slotLights = new Array(CFG.SLOT_COUNT).fill(false);
    round.winLanes = new Set();
    const idx = shuffle([...Array(CFG.SLOT_COUNT).keys()]);
    for (let i = 0; i < round.winSlots; i++) {
      round.winLanes.add(idx[i]);
      slotLights[idx[i]] = true;
    }
    spawnBall();
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---- 结算 ----
  function resolveBall(lane) {
    const mult = round.mult;
    const isWin = round.winLanes.has(lane);
    // 回合结束：清空中奖槽与指示灯（单回合只弹一次，弹珠转入回程）
    round.winLanes = new Set();
    slotLights = new Array(CFG.SLOT_COUNT).fill(false);
    // 弹珠不消失：转入回程相位，飞回发射管循环利用
    ball.phase = 'return';
    ball.returnT = 0;
    ball.returnFrom = { x: ball.x, y: ball.y };
    ball.sad = !isWin;
    state = 'returning';
    const from = slotCenterScreen(lane);

    if (isWin) {
      wins++;
      maxMult = Math.max(maxMult, mult);
      slotFlash = { lane, t: 0 };
      playWinSound(mult);
      if (mult >= 8) celebrate();
      // 一次性入账 bet×mult 筹码；飞球回余额改为装饰动画（上限 FLY_DECOR_MAX）
      addBalance(round.bet * mult);
      showLed(`🎉 中奖 x${mult} · +${round.bet * mult} 筹码！`);
      const flyCount = Math.min(round.bet * mult, CFG.FLY_DECOR_MAX);
      for (let i = 0; i < flyCount; i++) {
        setTimeout(() => {
          flyChipToBalance(from);
        }, i * 70);
      }
    } else {
      playMarioGameOver();
      showLed('差一点点，再来一次！');
      flyGrayBall(from);
    }
    updateUI();
    // 回程由 frame 循环驱动，到达管底后调 finishReturn
  }

  function slotCenterScreen(lane) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: rect.left + fieldX0 + (lane + 0.5) * slotW,
      y: rect.top + slotBottom - ballR,
    };
  }

  // 弹珠回管完成 → 回合结束
  function finishReturn() {
    state = 'idle';
    updateUI();
    showLed('投入筹码，看赔率跑灯！');
    // 破产判定：余额已不足最小投注（<=0 或 1~4 的零头都视为破产，避免软锁）
    if (balance < CFG.MIN_BET) {
      setTimeout(showGameOver, 600);
    }
  }

  function endAll() {
    clearLampTimers();
    ball = null;
  }

  function showGameOver() {
    state = 'gameover';
    endAll();
    $('ov-throws').textContent = throws;
    $('ov-peak').textContent = peak;
    $('ov-wins').textContent = wins;
    $('ov-maxmult').textContent = 'x' + maxMult;
    $('ov-best').textContent = bestPeak;
    overlay.classList.remove('hidden');
    celebrate();
  }

  function restart() {
    balance = CFG.INITIAL_BALLS;
    throws = 0;
    wins = 0;
    peak = balance;
    maxMult = 2;
    pending = 0;
    round = null;
    placeMarble();
    slotLights = new Array(CFG.SLOT_COUNT).fill(false);
    slotFlash = null;
    lampStates = CFG.LAMP_VALUES.map(() => 'off');
    overlay.classList.add('hidden');
    state = 'idle';
    updateUI();
    updateBalanceUI(null);
    showLed('投入筹码，看赔率跑灯！');
  }

  // ======================== HUD · DOM 界面 ========================
  function updateBalanceUI(flashClass) {
    balanceEl.textContent = balance;
    if (flashClass) {
      balanceEl.classList.remove('pop', 'pop-win');
      void balanceEl.offsetWidth; // 重启动画
      balanceEl.classList.add(flashClass);
    }
    throwsEl.textContent = throws;
    winsEl.textContent = wins;
  }

  function addBalance(delta) {
    balance += delta;
    peak = Math.max(peak, balance);
    if (peak > bestPeak) {
      bestPeak = peak;
      try { localStorage.setItem(STORAGE_KEY, String(bestPeak)); } catch (e) {}
    }
    balanceEl.textContent = balance;
    balanceEl.classList.remove('pop', 'pop-win');
    void balanceEl.offsetWidth;
    balanceEl.classList.add('pop-win');
    winsEl.textContent = wins;
  }

  function showLed(text, blink) {
    ledText = text;
    ledBlink = !!blink;
  }

  function updateUI() {
    // 筹码按钮（跑灯时整个区域切换为「停！」）
    const isIdle = state === 'idle';
    betBtn5.disabled = !isIdle || balance < CFG.MIN_BET;
    betBtn10.disabled = !isIdle || balance < CFG.MIN_BET * 2;
    betZone.classList.toggle('stopping', state === 'runningLights' || state === 'stopping');
  }

  function setState(s) {
    state = s;
    updateUI();
  }

  // ======================== Effects · 飞球与庆祝（DOM 装饰） ========================
  function randomChipColor() {
    return CHIP_COLORS[Math.floor(Math.random() * CHIP_COLORS.length)];
  }

  function removeOnSettle(el) {
    const settle = () => {
      if (el.dataset.settled) return;
      el.dataset.settled = '1';
      el.remove();
    };
    el.addEventListener('transitionend', settle);
    setTimeout(settle, 1200); // 兜底：动画被中断也清理 DOM
  }

  // 投入时筹码从按钮飞向发射管（n 颗依次飞，上限 BET_FLY_MAX）
  function flyChipsToMachine(n, fromRect) {
    const canvasRect = canvas.getBoundingClientRect();
    const target = {
      x: canvasRect.left + tubeCx,
      y: canvasRect.top + tubeBottomY - ballR - 4,
    };
    const from = fromRect || betBtn5.getBoundingClientRect();
    const fromX = from.left + from.width / 2;
    const fromY = from.top + from.height / 2;
    for (let i = 0; i < Math.min(n, CFG.BET_FLY_MAX); i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'fly-ball';
        el.style.left = fromX - 11 + 'px';
        el.style.top = fromY - 11 + 'px';
        el.style.background = 'radial-gradient(circle at 35% 30%, #fff, ' + randomChipColor() + ' 60%, #5a2b2b)';
        document.body.appendChild(el);
        removeOnSettle(el);
        requestAnimationFrame(() => {
          el.style.transform = `translate(${target.x - fromX}px, ${target.y - fromY}px) scale(0.6)`;
          el.style.opacity = '0.9';
        });
      }, i * 90);
    }
  }

  // 中奖筹码飞向余额（DOM 装饰动画；余额已在 resolveBall 一次性入账）
  function flyChipToBalance(from) {
    const rect = balanceEl.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'fly-ball';
    el.style.left = from.x - 11 + 'px';
    el.style.top = from.y - 11 + 'px';
    el.style.background = 'radial-gradient(circle at 35% 30%, #fff, ' + randomChipColor() + ' 60%, #7a2b2b)';
    document.body.appendChild(el);
    removeOnSettle(el);
    requestAnimationFrame(() => {
      const jitter = (Math.random() - 0.5) * 40;
      el.style.transform = `translate(${rect.left + rect.width / 2 - from.x + jitter}px, ${rect.top + rect.height / 2 - from.y}px) scale(0.55)`;
    });
  }

  // 空槽灰球飞散
  function flyGrayBall(from) {
    const el = document.createElement('div');
    el.className = 'fly-ball';
    el.style.left = from.x - 9 + 'px';
    el.style.top = from.y - 9 + 'px';
    el.style.width = '18px';
    el.style.height = '18px';
    el.style.background = 'radial-gradient(circle at 35% 30%, #eee, #999 70%, #666)';
    el.style.opacity = '0.85';
    document.body.appendChild(el);
    removeOnSettle(el);
    requestAnimationFrame(() => {
      el.style.transform = `translate(${(Math.random() - 0.5) * 120}px, -60px) scale(0.2)`;
      el.style.opacity = '0';
    });
  }

  // 庆祝特效（复用趣味画板 celebrateSuccess 模式）
  function celebrate() {
    const emojis = ['🎉','🌟','✨','💖','🎀','🏆','👏','🥳','💫','🎈'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const fragment = document.createDocumentFragment();
    const elements = [];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.cssText = `
        position:fixed; pointer-events:none; z-index:300;
        left:${cx + (Math.random()-0.5)*300}px; top:${cy + (Math.random()-0.5)*200}px;
        font-size:${24+Math.random()*40}px;
        transition: all 0.8s cubic-bezier(0,0.5,0.5,1);
        opacity:1;
      `;
      el.addEventListener('transitionend', function handler() {
        el.removeEventListener('transitionend', handler);
        el.remove();
      });
      setTimeout(() => { if (el.parentNode) el.remove(); }, 1500);
      fragment.appendChild(el);
      elements.push(el);
    }
    document.body.appendChild(fragment);
    requestAnimationFrame(() => {
      elements.forEach(el => {
        el.style.transform = `translate(${(Math.random()-0.5)*200}px, ${-100-Math.random()*150}px) scale(0.3)`;
        el.style.opacity = '0';
      });
    });
  }

  // ======================== Input · 交互 ========================
  let lastInteraction = 0;

  function canvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function inPlunger(p) {
    return p.x >= plungerRect.x0 && p.x <= plungerRect.x1 &&
           p.y >= plungerRect.y0 && p.y <= plungerRect.y1;
  }

  // ---- 弹簧杆拖拽（canvas hit-test） ----
  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'ballReady') return;
    const p = canvasPos(e);
    if (!inPlunger(p)) return;
    e.preventDefault();
    if (spaceCharging) cancelSpaceCharge();
    canvas.setPointerCapture(e.pointerId);
    pulling = true;
    springSnap = false;
    pullStartY = p.y;
    pullDist = 0;
    playChargeSound(0.2);
    chargeTimer = setInterval(() => {
      if (pulling) playChargeSound(pullDist / CFG.MAX_PULL);
    }, 160);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pulling) return;
    const p = canvasPos(e);
    pullDist = clamp(p.y - pullStartY, 0, CFG.MAX_PULL);
  });

  canvas.addEventListener('pointerup', () => {
    if (!pulling) return;
    endPull(true);
  });

  canvas.addEventListener('pointercancel', () => {
    if (pulling) endPull(false);
  });

  function endPull(launch) {
    const power = pullDist / CFG.MAX_PULL;
    pulling = false;
    springSnap = true; // 弹簧回弹动画
    if (chargeTimer) {
      clearInterval(chargeTimer);
      chargeTimer = null;
    }
    if (launch) {
      launchBall(power);
    } else {
      launchBall(0);
    }
  }

  // ---- 空格长按蓄力（松开弹出） ----
  let spaceCharging = false;
  let spacePower = 0;
  let spaceChargeTimer = null;

  function cancelSpaceCharge() {
    if (spaceChargeTimer) {
      clearInterval(spaceChargeTimer);
      spaceChargeTimer = null;
    }
    spaceCharging = false;
  }

  function onSpaceDown() {
    if (state !== 'ballReady' || pulling) return;
    spaceCharging = true;
    spacePower = 0;
    springSnap = false;
    playChargeSound(0.2);
    spaceChargeTimer = setInterval(() => {
      spacePower = Math.min(1, spacePower + 0.045);
      pullDist = spacePower * CFG.MAX_PULL;
      playChargeSound(spacePower);
    }, 45);
  }

  function onSpaceUp() {
    if (!spaceCharging) return;
    cancelSpaceCharge();
    const power = spacePower;
    springSnap = true;
    launchBall(power);
  }

  // ---- 按钮 ----
  betBtn5.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastInteraction < CFG.INTERACTION_DEBOUNCE) return;
    lastInteraction = now;
    initAudio();
    startGame(CFG.MIN_BET, betBtn5.getBoundingClientRect());
  });

  betBtn10.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastInteraction < CFG.INTERACTION_DEBOUNCE) return;
    lastInteraction = now;
    initAudio();
    startGame(CFG.MIN_BET * 2, betBtn10.getBoundingClientRect());
  });

  stopBtn.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastInteraction < CFG.INTERACTION_DEBOUNCE) return;
    lastInteraction = now;
    initAudio();
    stopLights();
  });

  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });

  $('restart-btn').addEventListener('click', () => {
    initAudio();
    restart();
  });

  // ---- 键盘投入：右键 +1 筹码 / ↑ +5 筹码 / 回车确认投入 ----
  function addPending(n) {
    if (state !== 'idle') return;
    pending = Math.min(pending + n, CFG.PENDING_MAX);
    showLed(`已选 ${pending} 筹码（→ +1 / ↑ +5），按回车开始`);
  }

  function confirmBet() {
    if (state === 'idle') {
      if (pending === 0) pending = CFG.MIN_BET;
      if (pending < CFG.MIN_BET) {
        showLed('至少投入 ' + CFG.MIN_BET + ' 筹码哦！', true);
        playWeakSound();
        return;
      }
      if (balance < pending) {
        showLed('筹码不够啦，只有 ' + balance + ' 颗！', true);
        playWeakSound();
        return;
      }
      startGame(pending);
    } else if (state === 'runningLights') {
      stopLights();
    }
  }

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault(); // 阻止浏览器右键菜单
    initAudio();
    addPending(1);
  });

  const preventKeys = [' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  document.addEventListener('keydown', (e) => {
    if (preventKeys.includes(e.key)) {
      e.preventDefault();
    }
    if (e.repeat) return;
    initAudio();
    if (e.key === 'Enter') {
      confirmBet();
    } else if (e.key === ' ') {
      onSpaceDown();
    } else if (e.key === 'ArrowUp') {
      addPending(CFG.MIN_BET);
    }
  });

  document.addEventListener('keyup', (e) => {
    if (e.key === ' ') {
      onSpaceUp();
    }
  });

  // ---- 尺寸变化 ----
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      resizeCanvas();
      if (ball && (ball.phase === 'free' || ball.phase === 'settling')) {
        ball.x = clamp(ball.x, fieldX0 + ballR, fieldX1 - ballR);
        ball.y = Math.min(ball.y, slotBottom - ballR);
      }
    }).observe(canvas);
  }
  window.addEventListener('resize', resizeCanvas);

  // 首次交互恢复音频
  ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
    document.addEventListener(evt, () => initAudio(), { once: true });
  });

  // ======================== 启动 ========================
  resizeCanvas();
  placeMarble();
  updateUI();
  updateBalanceUI(null);
  showLed('投入筹码，看赔率跑灯！');
  requestAnimationFrame((t) => {
    lastFrameTime = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
